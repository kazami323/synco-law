<body class="bg-background text-on-background font-body-md antialiased overflow-hidden">
<!-- Modal Overlay Backdrop -->
<div class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
<!-- Modal Container -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant w-full max-w-4xl flex flex-col max-h-[921px] shadow-[0_4px_24px_rgba(44,44,42,0.08)]">
<!-- Modal Header -->
<div class="flex items-center justify-between px-xl py-lg border-b border-outline-variant">
<div>
<h2 class="font-headline-h2 text-headline-h2 text-on-surface">Создать новый контракт</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs">Шаг 1 из 3</p>
</div>
<button class="text-on-surface-variant hover:text-primary transition-colors p-sm rounded-full hover:bg-surface-container-low focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Modal Content (Scrollable) -->
<div class="flex-1 overflow-y-auto px-xl py-xl bg-surface">
<!-- Stepper -->
<div class="mb-xl">
<div class="flex items-center">
<div class="flex flex-col items-center flex-1">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center font-headline-h3 text-headline-h3 z-10 relative shadow-[0_0_0_4px_#f8f9ff]">
                                1
                            </div>
<span class="font-body-sm text-body-sm text-primary mt-sm font-medium">Тип</span>
</div>
<div class="flex-1 h-[2px] bg-outline-variant mx-sm -mt-6"></div>
<div class="flex flex-col items-center flex-1">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-headline-h3 text-headline-h3 z-10 relative shadow-[0_0_0_4px_#f8f9ff]">
                                2
                            </div>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-sm">Детали</span>
</div>
<div class="flex-1 h-[2px] bg-outline-variant mx-sm -mt-6"></div>
<div class="flex flex-col items-center flex-1">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-headline-h3 text-headline-h3 z-10 relative shadow-[0_0_0_4px_#f8f9ff]">
                                3
                            </div>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-sm">Генерация</span>
</div>
</div>
</div>
<div class="mb-lg">
<h3 class="font-headline-h3 text-headline-h3 text-on-surface">Выберите тип контракта</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">Выберите базовый шаблон для начала работы.</p>
</div>
<!-- Grid of Cards -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-lg">
<!-- Card 1: Selected State Example -->
<label class="cursor-pointer group">
<input checked="" class="peer sr-only" name="contract_type" type="radio" value="sale"/>
<div class="bg-surface-container-lowest border-2 border-primary rounded-xl p-lg flex flex-col h-full transition-colors relative overflow-hidden">
<div class="absolute top-sm right-sm text-primary">
<span class="material-symbols-outlined" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="w-12 h-12 rounded-lg bg-primary/10 text-primary flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-[28px]" data-icon="shopping_cart">shopping_cart</span>
</div>
<h4 class="font-headline-h3 text-headline-h3 text-on-surface mb-xs">Купля-продажа</h4>
<p class="font-body-sm text-body-sm text-on-surface-variant flex-1">Договор купли-продажи товаров, оборудования или недвижимости.</p>
</div>
</label>
<!-- Card 2 -->
<label class="cursor-pointer group">
<input class="peer sr-only" name="contract_type" type="radio" value="rent"/>
<div class="bg-surface-container-lowest border border-outline-variant hover:border-primary rounded-xl p-lg flex flex-col h-full transition-colors peer-checked:border-2 peer-checked:border-primary peer-checked:shadow-none">
<div class="w-12 h-12 rounded-lg bg-surface-container-low text-on-surface-variant group-hover:text-primary transition-colors flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-[28px]" data-icon="real_estate_agent">real_estate_agent</span>
</div>
<h4 class="font-headline-h3 text-headline-h3 text-on-surface mb-xs group-hover:text-primary transition-colors">Аренда</h4>
<p class="font-body-sm text-body-sm text-on-surface-variant flex-1">Договор аренды коммерческой или жилой недвижимости, транспортных средств.</p>
</div>
</label>
<!-- Card 3 -->
<label class="cursor-pointer group">
<input class="peer sr-only" name="contract_type" type="radio" value="contracting"/>
<div class="bg-surface-container-lowest border border-outline-variant hover:border-primary rounded-xl p-lg flex flex-col h-full transition-colors peer-checked:border-2 peer-checked:border-primary peer-checked:shadow-none">
<div class="w-12 h-12 rounded-lg bg-surface-container-low text-on-surface-variant group-hover:text-primary transition-colors flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-[28px]" data-icon="handyman">handyman</span>
</div>
<h4 class="font-headline-h3 text-headline-h3 text-on-surface mb-xs group-hover:text-primary transition-colors">Подряд</h4>
<p class="font-body-sm text-body-sm text-on-surface-variant flex-1">Договор на выполнение строительных, ремонтных или иных работ.</p>
</div>
</label>
<!-- Card 4 -->
<label class="cursor-pointer group">
<input class="peer sr-only" name="contract_type" type="radio" value="nda"/>
<div class="bg-surface-container-lowest border border-outline-variant hover:border-primary rounded-xl p-lg flex flex-col h-full transition-colors peer-checked:border-2 peer-checked:border-primary peer-checked:shadow-none">
<div class="w-12 h-12 rounded-lg bg-surface-container-low text-on-surface-variant group-hover:text-primary transition-colors flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-[28px]" data-icon="lock">lock</span>
</div>
<h4 class="font-headline-h3 text-headline-h3 text-on-surface mb-xs group-hover:text-primary transition-colors">NDA</h4>
<p class="font-body-sm text-body-sm text-on-surface-variant flex-1">Соглашение о неразглашении конфиденциальной информации.</p>
</div>
</label>
<!-- Card 5 -->
<label class="cursor-pointer group">
<input class="peer sr-only" name="contract_type" type="radio" value="employment"/>
<div class="bg-surface-container-lowest border border-outline-variant hover:border-primary rounded-xl p-lg flex flex-col h-full transition-colors peer-checked:border-2 peer-checked:border-primary peer-checked:shadow-none">
<div class="w-12 h-12 rounded-lg bg-surface-container-low text-on-surface-variant group-hover:text-primary transition-colors flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-[28px]" data-icon="work">work</span>
</div>
<h4 class="font-headline-h3 text-headline-h3 text-on-surface mb-xs group-hover:text-primary transition-colors">Трудовой</h4>
<p class="font-body-sm text-body-sm text-on-surface-variant flex-1">Трудовой договор с сотрудником, контракт с руководителем.</p>
</div>
</label>
<!-- Card 6 -->
<label class="cursor-pointer group">
<input class="peer sr-only" name="contract_type" type="radio" value="other"/>
<div class="bg-surface-container-lowest border border-outline-variant hover:border-primary rounded-xl p-lg flex flex-col h-full transition-colors peer-checked:border-2 peer-checked:border-primary peer-checked:shadow-none">
<div class="w-12 h-12 rounded-lg bg-surface-container-low text-on-surface-variant group-hover:text-primary transition-colors flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-[28px]" data-icon="more_horiz">more_horiz</span>
</div>
<h4 class="font-headline-h3 text-headline-h3 text-on-surface mb-xs group-hover:text-primary transition-colors">Другое</h4>
<p class="font-body-sm text-body-sm text-on-surface-variant flex-1">Создать контракт с нуля или использовать пользовательский шаблон.</p>
</div>
</label>
</div>
</div>

<button class="font-body-md text-body-md text-on-surface-variant hover:text-on-surface px-md py-sm rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
                    Отмена

<button class="font-body-md text-body-md text-on-surface-variant/50 border border-outline-variant/50 px-xl py-[10px] rounded-lg cursor-not-allowed bg-surface-container-lowest flex items-center justify-center min-w-[100px] h-[40px]" disabled="">
                        Назад
                    </button>
<button class="font-body-md text-body-md text-on-primary bg-primary hover:bg-surface-tint transition-colors px-xl py-[10px] rounded-lg shadow-sm flex items-center justify-center min-w-[100px] h-[40px] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
                        Далее
                    </button>
</div>
</div>
